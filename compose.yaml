services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: product_storage
      POSTGRES_USER: product_storage
      POSTGRES_PASSWORD: product_storage_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_storage -d product_storage"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
