syntax = "proto3";

option csharp_namespace = "ProductStorage.Api.Grpc";

package products;

import "google/protobuf/timestamp.proto";

service Products {
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  rpc GetProducts (GetProductsRequest) returns (GetProductsResponse);
  rpc GetProductById (GetProductByIdRequest) returns (ProductReply);
}

enum ProductType {
  PRODUCT_TYPE_UNSPECIFIED = 0;
  PRODUCT_TYPE_GENERAL = 1;
  PRODUCT_TYPE_HOUSEHOLD_CHEMICALS = 2;
  PRODUCT_TYPE_APPLIANCES = 3;
  PRODUCT_TYPE_FOOD = 4;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  double weight = 3;
  ProductType type = 4;
  int32 warehouse_number = 5;
}

message CreateProductResponse {
  string id = 1;
}

message GetProductsRequest {
  optional string created_date = 1;
  optional ProductType type = 2;
  optional int32 warehouse_number = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message GetProductsResponse {
  repeated ProductReply items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetProductByIdRequest {
  string id = 1;
}

message ProductReply {
  string id = 1;
  string name = 2;
  double price = 3;
  double weight = 4;
  ProductType type = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 warehouse_number = 7;
}
